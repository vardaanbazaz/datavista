name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages permissions.
permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main are never cancelled here
# (the deploy job has its own "pages" group).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast gates; runs in parallel with e2e and build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality Gate (Lint)
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Resilience Gate (Test)
        run: npm run test

      # Date tests (*.tz.test.ts + golden.messy) under IST, New York and UTC; results must not move.
      - name: Time Zone Gate (Dates)
        run: npm run test:tz

  # Full e2e suite against the dev server (playwright.config.ts), so it can't rot again.
  # Its own job: it is most of the run time, so the other gates no longer wait behind it.
  # Runs in the official Playwright image, which ships the browsers and their system
  # libraries, so there is no `playwright install --with-deps` (apt) step. The tag must match
  # the @playwright/test version in package-lock.json (1.62.0); bump both together.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: End-to-End Gate (Playwright)
        run: npm run test:e2e

  # Builds the bundle, smoke-tests it and uploads that exact dist/ as the Pages artifact.
  # Runs in parallel with checks and e2e; nothing is rebuilt after the smoke gate.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Artifact
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production Smoke Gate
        run: npx playwright test --config playwright.prod.config.ts

      - name: Upload Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  # Deploys the artifact the build job smoke-tested, once all three jobs pass. No checkout, no build.
  # Only for a push to main: pull requests (and manual runs) stop after the gates.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e, build]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
