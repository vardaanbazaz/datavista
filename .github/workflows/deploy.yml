name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality Gate (Lint)
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Resilience Gate (Test)
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Full e2e suite against the dev server (playwright.config.ts), so it can't rot again.
      - name: End-to-End Gate (Playwright)
        run: npm run test:e2e

      - name: Build Artifact
        run: npm run build

      - name: Production Smoke Gate
        run: npx playwright test --config playwright.prod.config.ts

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
